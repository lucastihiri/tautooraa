n 18 33 - 19 30 Col De L'Ange 24 11 2024.pdf »<\/a><\/p>\n\n<p>Dans l'Histoire du Dieu Yahvé, dans sa Première Alliance, puis dans sa Deuxième Alliance, celle-ci avec l'Espérance du Royaume qui vient, tu n'es pas un objet à manipuler pour servir le narcissisme des êtres humains, tu n'es pas non plus une Image pour refléter la mêmeté de ce monde. En Christ Crucifié et <\/p>\n<p>Ressuscité, tu es Fille Adoptive / Fils Adoptif de par ton Baptême.<\/p>\n<p>La Mission Première de toute église locale est de prêcher cette Bonne Nouvelle ! Voici donc, une collaboration parmi tant d'autres publiées, collaboration qu'il appartiendra à chacune et à chacun de s'en approprier en poursuivant selon sa foi, sa communauté ecclésiale locale et universelle, ou selon sa religion.<\/p>\n<p>En passant, rappelons-nous que la Page Web devenue universelle a été créée par 4 ministres ecclésiaux au 20ème Siècle : c'était alors pour partager leur bibliothèque respective, mais aussi en vue de transmettre cet outil de communication ! Les Sciences des Religions nomment cet événement : le passage du Sacré au Profane ! Ce que le Seigneur rappelle de génération en génération : L'arrachement de ce qui relève du Royaume par ce monde : Depuis les jours de Jean le Baptiseur jusqu'à présent, le royaume des cieux est soumis à la violence, et ce sont les violents qui s'en emparent Matthieu 11/12.<\/p>\n<p>Nous suivrons l'évangile de Luc en dégageant à l'occasion ce qui relèvent de la demande et du voyage du désir de l'être humain à la Rencontre du Christ. D'autres références sur ce blog existent et méritent des mises à jours pour compléter !<\/p>\n<p>Puis nous continuerons avec les autres Textes Bibliques !<\/p>\n<p>Texte māòhiphone et francophone:<\/p>\n<p><a href=\"https://ekladata.com/5Qf3QnjX4qEeso9dX7FFzuw2cn8/-Antonino-Tihiri-Lucas-Pre-dications-TI-TAURAA-E-TAUTOORAA-MA-TI-2016.pdf\" rel=\"noopener\" target=\"_blank\">Télécharger « Antonino Tihiri Lucas Prédications TÏTAURAA E TAUTOORAA MÄTI 2016. \"_blank\">Tārena Pīpīria 2025<\/a><\/p>\n<p class=\"h\"><strong>Autres Sources Cf. 2.1. Dictionnaire et Concordance <\/strong><\/p>\n<p><a href=\"https://drive.google.com/uc?export=download&amp;id=1rK6uDhrCNzlBCwxCQb_H27ve4toP6CFN\" rel=\"noopener\" target=\"_blank\">Télécharger Putuaparau Pïpïria - Vocabulaire Biblique 2011<\/a> <\/p>\n<p><a href=\"https://drive.google.com/uc?export=download&amp;id=19NL-FbZ_NZuPdVRPBgvmRkZhl4PQMQQ7\" rel=\"noopener\" target=\"_blank\">Télécharger Brève Histoire de la LMS<\/a> <strong>1997<\/strong><\/p>\n<p><a href=\"https://drive.google.com/uc?export=download&amp;id=1hntbyTFzuffgUGbQ39INk45B04E3jam2\" rel=\"noopener\" target=\"_blank\">Télécharger Luc 12/49-53<\/a> : <strong>Le Déjà-là de la Division<\/strong><\/p>\n<p><a href=\"https://drive.google.com/uc?export=download&amp;id=1e70dgp_mmc5cStVNhIOEoPlOymGPOewS\" rel=\"noopener\" target=\"_blank\">Télecharger Luc 4/1-13<\/a> :<strong> L'Épreuve et la Dés-épreuve<\/strong><\/p>\n\n\n","x":"Evangile en partage ! Te Bibilia Mo'a Ra 1838 : Télécharger « 1. TBMR 1838 EEPF EPM 60.pdf » Te Bibilia Mo'a Ra 1878 a vec les Références Marginales : Télécharg","k":146},{"id":2,"kind":"Page","st":"2","cm":[],"t":"Accueil","n":"1","c":"1","d":"2024-11-24","a":"Ture Èvaneria","h":"\n\n\n<p>Ia ora na roa i te Aroha o te Fatu,<\/p>\n<p>Salutations dans l'Amour du Seigneur ! <\/p>\n<p>Ce blog est une reprise partielle d'un autre blog destiné à la Formation Théologique et Pastorale (Pâques 2020), donc lors du tout premier confinement à Mäòhi Nui (Polynésie Française).<\/p>\n<p>Nous présenterons d'autres textes en chemin, <\/p>\n<p>certes toujours en vue de la Formation Théologique et Pastorale, <\/p>\n<p>mais cette fois-ci <\/p>\n<p>en vue de l'Annonce de l'Evangile, de la réception du Don du Baptême, de la Célébration de la Cène, du Cheminement en Eglise sous l'Autorité des Ecritures Saintes, <\/p>\n<p>c'est-à-dire en résumé l'Edification et la Sanctification, Sacerdoce et Espérance du Royaume qui vient.<\/p>\n<p>En attendant, bonne lecture, et pensez <\/p>\n<p>d'une part à vous inscrire pour recevoir les nouveautés en temps réel,<\/p>\n<p>et d'autre part à nous faire part de vos remarques. <\/p>\n<p>NB: Les photos et images, pour le moment, sont difficiles à y mettre : lorsque nous aurons notre abonnement, ce sera possible !<\/p>\n\n<p>I te Fatu ä tätou mä ta na Haamaitaìraa, ta na Parauamaitaì,<\/p>\n<p>Que la Bénédiction de notre Seigneur nous accompagne,<\/p>\n<p>Pasteur Tihiri Lucas,<\/p>\n<p>À l'Embouchure de la Vocation et de la Retraite, Temps et Lieux où l'Estuaire s'y donne aussi en Delta, et inversement le Delta s'y rassemblant en Estuaire. C'est dire que Nul ne maîtrise les oeuvres de l'Esprit de notre Sauveur et Seigneur, Jésus-Christ Crucifié et Ressuscité!<\/p> \n\n","x":"Ia ora na roa i te Aroha o te Fatu, Salutations dans l'Amour du Seigneur ! Ce blog est une reprise partielle d'un autre blog destiné à la Formation Théologique ","k":0},{"id":3,"kind":"Article","st":"2","cm":[],"t":"Bible TBMR","n":"1.1","c":"1","d":"2025-03-01","a":"Ture Èvaneria","h":"\n\n\n<p class=\"h\"><strong>05/03/2024<\/strong><\/p>\n<p class=\"h\"><strong>Te Bibilia Mo'a Ra 1838 : <\/strong><\/p>\n<p><a href=\"https://ekladata.com/uB_HHDRk9FIx9oBiEZHqqHvpTd0/-1.-TBMR-1838-EEPF-EPM-60.pdf\" rel=\"noopener\" target=\"_blank\">Télécharger « 1. TBMR 1838 EEPF EPM 60.pdf »<\/a><\/p>\n<p><strong>Te Bibilia Mo'a Ra 1878<\/strong><strong>avec les Références Marginales : <\/strong><\/p>\n<p><a href=\"https://ekladata.com/4_talkqScBGk2s7drwNpH2FlVFo/TBMR-1878-Consultation-Relecture-Re-fe-rences.pdf\" rel=\"noopener\" target=\"_blank\">Télécharger « TBMR 1878 Consultation Relecture Références.pdf »<\/a><\/p>\n<p class=\"h\"><strong>Te Bibilia Mo'a Ra 1878 avec Révision Linguistique de 1996 à 2018: <\/strong><\/p>\n<p><a href=\"https://ekladata.com/g4mRt-FzSFzQ0L9qnwGwJ9hD0cs/-3.-TBMR-2020-EEPF-EPM-60.pdf\" rel=\"noopener\" target=\"_blank\">Télécharger « 3. TBMR 2020 EEPF EPM DJb7eL-ou0TL0/-TBMR-2023-Lecture.pdf\" rel=\"noopener\" target=\"_blank\">Télécharger « TBMR 2023 Lecture.pdf »<\/a><\/p>\n<p><a href=\"https://ekladata.com/iy0fA29YoVQiBk7ZIKGk0pyw-2U/Ioane-Jean-18-33-19-30-Col-De-L-Ange-24-11-2024.pdf\" rel=\"noopener\" target=\"_blank\">Télécharger « Ioane, Jean 18 33 - 19 30 Col De L'Ange 24 11 2024.pdf »<\/a><\/p>\n\n<p>Dans l'Histoire du Dieu Yahvé, dans sa Première Alliance, puis dans sa Deuxième Alliance, celle-ci avec l'Espérance du Royaume qui vient, tu n'es pas un objet à manipuler pour servir le narcissisme des êtres humains, tu n'es pas non plus une Image pour refléter la mêmeté de ce monde. En Christ Crucifié et <\/p>\n<p>Ressuscité, tu es Fille Adoptive / Fils Adoptif de par ton Baptême.<\/p>\n<p>La Mission Première de toute église locale est de prêcher cette Bonne Nouvelle ! Voici donc, une collaboration parmi tant d'autres publiées, collaboration qu'il appartiendra à chacune et à chacun de s'en approprier en poursuivant selon sa foi, sa communauté ecclésiale locale et universelle, ou selon sa religion.<\/p>\n<p>En passant, rappelons-nous que la Page Web devenue universelle a été créée par 4 ministres ecclésiaux au 20ème Siècle : c'était alors pour partager leur bibliothèque respective, mais aussi en vue de transmettre cet outil de communication ! Les Sciences des Religions nomment cet événement : le passage du Sacré au Profane ! Ce que le Seigneur rappelle de génération en génération : L'arrachement de ce qui relève du Royaume par ce monde : Depuis les jours de Jean le Baptiseur jusqu'à présent, le royaume des cieux est soumis à la violence, et ce sont les violents qui s'en emparent Matthieu 11/12.<\/p>\n<p>Nous suivrons l'évangile de Luc en dégageant à l'occasion ce qui relèvent de la demande et du voyage du désir de l'être humain à la Rencontre du Christ. D'autres références sur ce blog existent et méritent des mises à jours pour compléter !<\/p>\n<p>Puis nous continuerons avec les autres Textes Bibliques !<\/p>\n
